# Sistema completo: 4 bases PostgreSQL, 1 MongoDB, 1 Redis, 6 microservicios y el API Gateway (13 contenedores).
#   Todo:            docker compose up -d --build
#   Solo las bases:  docker compose up -d db-eventos db-reservas db-ventas db-auth mongo redis  (servicios desde el IDE)
# Dentro de la red de compose los servicios se llaman por nombre de servicio; fuera de compose
# cada application.yml usa localhost por defecto.
services:
  db-eventos:
    image: postgres:16-alpine
    container_name: ticketya-db-eventos
    environment:
      POSTGRES_DB: db_eventos
      POSTGRES_USER: ticketya
      POSTGRES_PASSWORD: ticketya
    ports:
      - "5433:5432"
    volumes:
      - db-eventos-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketya -d db_eventos"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-reservas:
    image: postgres:16-alpine
    container_name: ticketya-db-reservas
    environment:
      POSTGRES_DB: db_reservas
      POSTGRES_USER: ticketya
      POSTGRES_PASSWORD: ticketya
    ports:
      - "5434:5432"
    volumes:
      - db-reservas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketya -d db_reservas"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-ventas:
    image: postgres:16-alpine
    container_name: ticketya-db-ventas
    environment:
      POSTGRES_DB: db_ventas
      POSTGRES_USER: ticketya
      POSTGRES_PASSWORD: ticketya
    ports:
      - "5435:5432"
    volumes:
      - db-ventas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketya -d db_ventas"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-auth:
    image: postgres:16-alpine
    container_name: ticketya-db-auth
    environment:
      POSTGRES_DB: db_auth
      POSTGRES_USER: ticketya
      POSTGRES_PASSWORD: ticketya
    ports:
      - "5436:5432"
    volumes:
      - db-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketya -d db_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MongoDB compartido por los servicios NoSQL; cada uno usa su propia base (ms-notificaciones: db_notificaciones).
  mongo:
    image: mongo:7
    container_name: ticketya-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ticketya
      MONGO_INITDB_ROOT_PASSWORD: ticketya
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      # En una máquina cargada mongo tarda más en arrancar: las fallas de este período no cuentan como intentos.
      start_period: 30s

  # Redis de la fila virtual (ms-fila). AOF sobre un volumen: la fila sobrevive a un reinicio del contenedor.
  redis:
    image: redis:7-alpine
    container_name: ticketya-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ms-eventos:
    build: ./ms-eventos
    image: ticketya/ms-eventos
    container_name: ticketya-ms-eventos
    environment:
      DB_URL: jdbc:postgresql://db-eventos:5432/db_eventos
      DB_USER: ticketya
      DB_PASSWORD: ticketya
      MS_RESERVAS_URL: http://ms-reservas:8082
      MS_VENTAS_URL: http://ms-ventas:8083
    ports:
      - "8081:8081"
    depends_on:
      db-eventos:
        condition: service_healthy

  ms-reservas:
    build: ./ms-reservas
    image: ticketya/ms-reservas
    container_name: ticketya-ms-reservas
    environment:
      DB_URL: jdbc:postgresql://db-reservas:5432/db_reservas
      DB_USER: ticketya
      DB_PASSWORD: ticketya
      MS_EVENTOS_URL: http://ms-eventos:8081
      # Sin depends_on a ms-fila: si no responde, las reservas siguen (fail-open, add-fila-virtual).
      MS_FILA_URL: http://ms-fila:8086
    ports:
      - "8082:8082"
    depends_on:
      db-reservas:
        condition: service_healthy

  ms-ventas:
    build: ./ms-ventas
    image: ticketya/ms-ventas
    container_name: ticketya-ms-ventas
    environment:
      DB_URL: jdbc:postgresql://db-ventas:5432/db_ventas
      DB_USER: ticketya
      DB_PASSWORD: ticketya
      MS_EVENTOS_URL: http://ms-eventos:8081
      MS_RESERVAS_URL: http://ms-reservas:8082
      MS_NOTIFICACIONES_URL: http://ms-notificaciones:8085
    ports:
      - "8083:8083"
    depends_on:
      db-ventas:
        condition: service_healthy

  ms-auth:
    build: ./ms-auth
    image: ticketya/ms-auth
    container_name: ticketya-ms-auth
    environment:
      DB_URL: jdbc:postgresql://db-auth:5432/db_auth
      DB_USER: ticketya
      DB_PASSWORD: ticketya
      # Secreto compartido con el gateway. El valor por defecto es el de desarrollo de los
      # application.yml; para otro entorno se define JWT_SECRET en el shell o en un .env (no versionado).
      JWT_SECRET: ${JWT_SECRET:-U2VjcmV0S2V5UGFyYUpXVFRpY2tldFlhMjAyNlN1cGVyU2VjcmV0YQ==}
    ports:
      - "8084:8084"
    depends_on:
      db-auth:
        condition: service_healthy

  ms-notificaciones:
    build: ./ms-notificaciones
    image: ticketya/ms-notificaciones
    container_name: ticketya-ms-notificaciones
    environment:
      MONGO_URI: mongodb://ticketya:ticketya@mongo:27017/db_notificaciones?authSource=admin
    ports:
      - "8085:8085"
    depends_on:
      mongo:
        condition: service_healthy

  ms-fila:
    build: ./ms-fila
    image: ticketya/ms-fila
    container_name: ticketya-ms-fila
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8086:8086"
    depends_on:
      redis:
        condition: service_healthy

  # El gateway arranca al final, después de los microservicios a los que enruta.
  api-gateway:
    build: ./api-gateway
    image: ticketya/api-gateway
    container_name: ticketya-api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:-U2VjcmV0S2V5UGFyYUpXVFRpY2tldFlhMjAyNlN1cGVyU2VjcmV0YQ==}
      MS_AUTH_URL: http://ms-auth:8084
      MS_EVENTOS_URL: http://ms-eventos:8081
      MS_RESERVAS_URL: http://ms-reservas:8082
      MS_VENTAS_URL: http://ms-ventas:8083
      MS_FILA_URL: http://ms-fila:8086
    ports:
      - "8080:8080"
    depends_on:
      ms-eventos:
        condition: service_started
      ms-reservas:
        condition: service_started
      ms-ventas:
        condition: service_started
      ms-auth:
        condition: service_started
      ms-fila:
        condition: service_started

volumes:
  db-eventos-data:
  db-reservas-data:
  db-ventas-data:
  db-auth-data:
  mongo-data:
  redis-data:
