server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          # El gateway quita el prefijo /api (StripPrefix=1) y reenvía los headers.
          # /internal/** no tiene ruta.
          routes:
            - id: auth
              uri: ${MS_AUTH_URL:http://localhost:8084}
              order: 0
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: auth
                    fallbackUri: forward:/fallback/auth

            - id: reservas-disponibilidad
              uri: ${MS_RESERVAS_URL:http://localhost:8082}
              order: 0
              predicates:
                - Path=/api/eventos/*/disponibilidad,/api/eventos/*/sectores/*/asientos
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: reservas
                    fallbackUri: forward:/fallback/reservas

            - id: reservas
              uri: ${MS_RESERVAS_URL:http://localhost:8082}
              order: 1
              predicates:
                - Path=/api/reservas,/api/reservas/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: reservas
                    fallbackUri: forward:/fallback/reservas

            - id: eventos
              uri: ${MS_EVENTOS_URL:http://localhost:8081}
              order: 2
              predicates:
                - Path=/api/lugares,/api/lugares/**,/api/eventos,/api/eventos/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: eventos
                    fallbackUri: forward:/fallback/eventos

            - id: ventas
              uri: ${MS_VENTAS_URL:http://localhost:8083}
              order: 3
              predicates:
                - Path=/api/compras,/api/compras/**,/api/entradas,/api/entradas/**,/api/devoluciones,/api/devoluciones/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: ventas
                    fallbackUri: forward:/fallback/ventas

jwt:
  # Valor de desarrollo; en un despliegue real se define JWT_SECRET (debe coincidir con el de ms-auth).
  secret: ${JWT_SECRET:U2VjcmV0S2V5UGFyYUpXVFRpY2tldFlhMjAyNlN1cGVyU2VjcmV0YQ==}

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,gateway

resilience4j:
  circuitbreaker:
    instances:
      auth:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      reservas:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      eventos:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      ventas:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
