server:
  port: 8082

spring:
  application:
    name: ms-reservas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/db_reservas}
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
    hikari:
      # Sesion de la base en UTC (design.md, "Huso horario de la sesion"): localtimestamp y las columnas
      # timestamp quedan en UTC sin importar el huso de cada instancia, en linea con hibernate.jdbc.time_zone.
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

ticketya:
  reserva:
    minutos-expiracion: 10
    max-por-cliente-default: 4
  services:
    eventos-url: ${MS_EVENTOS_URL:http://localhost:8081}
    eventos-timeout-ms: 3000
  jobs:
    habilitados: true
    intervalo-ms: 30000
    lote-vencimiento: 100
