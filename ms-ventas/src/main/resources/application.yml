server:
  port: 8083

spring:
  application:
    name: ms-ventas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/db_ventas}
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  pattern:
    # Cada linea lleva el correlationId de la solicitud o del proceso en curso (MDC, add-trazabilidad).
    level: "%5p [%X{correlationId:-}]"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

ticketya:
  jobs:
    habilitados: true
  pagos:
    max-reintentos: 2
    reconciliacion:
      intervalo-ms: 30000
    pasarela:
      consultas-inciertas-timeout: 2
  devolucion:
    horas-minimas-antes-del-evento: 72
    # Las fechas de los eventos son hora local sin offset: el plazo se mide en esta zona.
    zona-horaria-eventos: America/Argentina/Buenos_Aires
  services:
    eventos-url: ${MS_EVENTOS_URL:http://localhost:8081}
    reservas-url: ${MS_RESERVAS_URL:http://localhost:8082}
    notificaciones-url: ${MS_NOTIFICACIONES_URL:http://localhost:8085}
    notificaciones-connect-timeout-ms: 1000
    notificaciones-read-timeout-ms: 2000
    notificaciones-email-dominio: ticketya.local
