# Sistema completo: 3 bases PostgreSQL, 3 microservicios y el API Gateway.
#   Todo:            docker compose up -d --build
#   Solo las bases:  docker compose up -d db-eventos db-reservas db-ventas  (servicios desde el IDE)
# Dentro de la red de compose los servicios se llaman por nombre de servicio; fuera de compose
# cada application.yml usa localhost por defecto.
services:
  db-eventos:
    image: postgres:16-alpine
    container_name: ticketya-db-eventos
    environment:
      POSTGRES_DB: db_eventos
      POSTGRES_USER: ticketya
      POSTGRES_PASSWORD: ticketya
    ports:
      - "5433:5432"
    volumes:
      - db-eventos-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketya -d db_eventos"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-reservas:
    image: postgres:16-alpine
    container_name: ticketya-db-reservas
    environment:
      POSTGRES_DB: db_reservas
      POSTGRES_USER: ticketya
      POSTGRES_PASSWORD: ticketya
    ports:
      - "5434:5432"
    volumes:
      - db-reservas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketya -d db_reservas"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-ventas:
    image: postgres:16-alpine
    container_name: ticketya-db-ventas
    environment:
      POSTGRES_DB: db_ventas
      POSTGRES_USER: ticketya
      POSTGRES_PASSWORD: ticketya
    ports:
      - "5435:5432"
    volumes:
      - db-ventas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketya -d db_ventas"]
      interval: 5s
      timeout: 5s
      retries: 10

  ms-eventos:
    build: ./ms-eventos
    image: ticketya/ms-eventos
    container_name: ticketya-ms-eventos
    environment:
      DB_URL: jdbc:postgresql://db-eventos:5432/db_eventos
      DB_USER: ticketya
      DB_PASSWORD: ticketya
      MS_RESERVAS_URL: http://ms-reservas:8082
      MS_VENTAS_URL: http://ms-ventas:8083
    ports:
      - "8081:8081"
    depends_on:
      db-eventos:
        condition: service_healthy

  ms-reservas:
    build: ./ms-reservas
    image: ticketya/ms-reservas
    container_name: ticketya-ms-reservas
    environment:
      DB_URL: jdbc:postgresql://db-reservas:5432/db_reservas
      DB_USER: ticketya
      DB_PASSWORD: ticketya
      MS_EVENTOS_URL: http://ms-eventos:8081
    ports:
      - "8082:8082"
    depends_on:
      db-reservas:
        condition: service_healthy

  ms-ventas:
    build: ./ms-ventas
    image: ticketya/ms-ventas
    container_name: ticketya-ms-ventas
    environment:
      DB_URL: jdbc:postgresql://db-ventas:5432/db_ventas
      DB_USER: ticketya
      DB_PASSWORD: ticketya
      MS_EVENTOS_URL: http://ms-eventos:8081
      MS_RESERVAS_URL: http://ms-reservas:8082
    ports:
      - "8083:8083"
    depends_on:
      db-ventas:
        condition: service_healthy

  # El gateway arranca al final, después de los tres microservicios.
  api-gateway:
    build: ./api-gateway
    image: ticketya/api-gateway
    container_name: ticketya-api-gateway
    environment:
      MS_EVENTOS_URL: http://ms-eventos:8081
      MS_RESERVAS_URL: http://ms-reservas:8082
      MS_VENTAS_URL: http://ms-ventas:8083
    ports:
      - "8080:8080"
    depends_on:
      ms-eventos:
        condition: service_started
      ms-reservas:
        condition: service_started
      ms-ventas:
        condition: service_started

volumes:
  db-eventos-data:
  db-reservas-data:
  db-ventas-data:
